# Netlify Configuration for AegisTrust AI
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Route all requests to index.html for Single Page Application client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
